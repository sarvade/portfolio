<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Archivo'; src: url('../../src/fonts/archivo-var-subset.woff2') format('woff2'); font-weight: 400 800; font-stretch: 100% 125%; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'Archivo', sans-serif; color: #eaf0f6; background: #0b1a2b;
    background-image: linear-gradient(rgb(140 200 255 / 0.07) 1px, transparent 1px), linear-gradient(90deg, rgb(140 200 255 / 0.07) 1px, transparent 1px);
    background-size: 28px 28px; background-position: -1px -1px;
    padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .name { font-size: 30px; font-weight: 700; font-stretch: 118%; letter-spacing: -0.01em; }
  h1 { font-size: 78px; white-space: nowrap; line-height: 1.02; font-weight: 760; font-stretch: 125%; letter-spacing: -0.03em; }
  h1 .accent { color: #8cc8ff; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; color: #a6b8cb; font-size: 26px; }
  svg { width: 360px; height: auto; }
</style>
</head>
<body>
  <p class="name">Sai S Sarvade</p>
  <h1>Raw logs in.<br><span class="accent">Trusted numbers out.</span></h1>
  <div class="foot">
    <p>Data engineer at TikTok<br>sarvade.github.io/portfolio</p>
    <svg viewBox="0 0 360 60" aria-hidden="true">
      <path d="M60 30H300" stroke="#3a5f86" stroke-width="2.5"/>
      <rect x="2" y="12" width="70" height="36" rx="6" fill="#0b1a2b" stroke="#3a5f86" stroke-width="2"/>
      <rect x="145" y="8" width="70" height="44" rx="6" fill="#0b1a2b" stroke="#8cc8ff" stroke-width="2.5"/>
      <rect x="288" y="12" width="70" height="36" rx="6" fill="#0b1a2b" stroke="#3a5f86" stroke-width="2"/>
      <circle cx="108" cy="30" r="6" fill="#8cc8ff"/>
      <circle cx="252" cy="30" r="6" fill="#8cc8ff"/>
    </svg>
  </div>
</body>
</html>
